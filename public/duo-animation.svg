<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f1a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#e0e7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- hinge line -->
  <rect x="596" y="60" width="8" height="555" rx="4" fill="#000" opacity="0.6"/>
  <!-- left panel -->
  <g transform="skewY(-4)">
    <rect x="180" y="130" width="400" height="440" rx="28" fill="#111827" stroke="#6366f1" stroke-width="2"/>
    <rect x="210" y="165" width="180" height="16" rx="8" fill="#374151"/>
    <rect x="210" y="195" width="340" height="90" rx="14" fill="#1f2937"/>
    <rect x="210" y="300" width="340" height="14" rx="7" fill="#4b5563"/>
    <rect x="210" y="324" width="260" height="14" rx="7" fill="#374151"/>
    <rect x="210" y="360" width="340" height="120" rx="14" fill="url(#glass)"/>
  </g>
  <!-- right panel folded -->
  <g transform="translate(604,0) skewY(6)">
    <rect x="20" y="150" width="400" height="440" rx="28" fill="#0b0b14" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="50" y="185" width="180" height="16" rx="8" fill="#4c1d95"/>
    <rect x="50" y="215" width="340" height="90" rx="14" fill="#1e1b4b"/>
    <rect x="50" y="320" width="340" height="14" rx="7" fill="#6d28d9"/>
    <rect x="50" y="344" width="260" height="14" rx="7" fill="#4c1d95"/>
  </g>
  <!-- title -->
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">DuoFold — Duo Animation</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="20" fill="#c4b5fd">iPhone Duo fold / opening animation for Android • Kotlin • AGSL shader</text>
  <!-- stats pills -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <rect x="70" y="560" width="170" height="48" rx="24" fill="#facc15"/>
    <text x="155" y="591" text-anchor="middle" fill="#111">★ 183 stars</text>
    <rect x="255" y="560" width="150" height="48" rx="24" fill="#0ea5e9"/>
    <text x="330" y="591" text-anchor="middle" fill="#fff">⑂ 28 forks</text>
  </g>
</svg>
